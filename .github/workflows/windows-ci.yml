name: Windows native development candidate
on:
  push:
    branches: [main, phase-2-native-integration]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout independent Windows source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Record source and native runner
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          "UV_PYTHON_INSTALL_DIR=$env:RUNNER_TEMP/gmt-python" | Out-File -FilePath $env:GITHUB_ENV -Append
          "UV_CACHE_DIR=$env:RUNNER_TEMP/gmt-uv-cache" | Out-File -FilePath $env:GITHUB_ENV -Append
          $info = @{ sourceSHA = (git rev-parse HEAD); runnerOS = $env:RUNNER_OS; runnerArch = $env:RUNNER_ARCH; imageOS = $env:ImageOS; imageVersion = $env:ImageVersion; runURL = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; installerExecution = 'NOT VERIFIED'; interactiveWindows11 = 'NOT VERIFIED' }
          $info | ConvertTo-Json | Set-Content reports/runner.json
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') { throw 'Native Windows x64 required' }
      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.3"
      - name: Setup pinned Python provisioning tool
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.3"
          python-version: "3.11.17"
          python-arch: "x86_64"
          enable-cache: "false"
      - name: Install exact Python and verify runtime architecture
        run: |
          uv python install 3.11.17
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = uv python find --managed-python 3.11.17
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -c "import sys,struct; assert sys.version_info[:3] == (3,11,17); assert struct.calcsize('P') == 8; print(sys.version)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "GMT_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Create Python environment and install hash-locked wheels
        run: |
          & $env:GMT_PYTHON -m venv backend/.venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & backend/.venv/Scripts/python.exe -m pip install --require-hashes --only-binary=:all: -r backend/requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Dependency inventory and notices
        run: node scripts/notices.mjs
      - name: TypeScript, frontend, backend and Electron security tests
        run: npm run test
      - name: Build renderer, main and preload
        run: npm run build
      - name: Native PyInstaller, frozen smoke, Electron directory and NSIS build
        run: npm run package:windows
      - name: Packaged Electron startup, offline assets, IPC and shutdown smoke
        run: |
          npm run test:packaged
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/native-smoke.mjs --packaged
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify expected packaged files and calculate SHA-256
        run: node scripts/verify-artifacts.mjs
      - name: Record unverified interactive acceptance
        if: always()
        run: |
          @('Windows 11 interactive install/uninstall: NOT VERIFIED', 'Windows Defender/SmartScreen downloaded-artifact acceptance: NOT VERIFIED', 'Code signing: unsigned development candidate', 'Official release: NOT PUBLISHED') | Set-Content reports/interactive-acceptance.txt
      - name: Upload redacted development reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gmt-windows-native-reports-${{ github.sha }}
          path: reports/
          if-no-files-found: error
          retention-days: 7
      - name: Upload successful unsigned development candidate
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gmt-windows-native-unsigned-x64-${{ github.sha }}
          path: |
            release/GMT-Windows-0.1.0-dev-x64-Setup.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
